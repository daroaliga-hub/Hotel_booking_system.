{% extends 'base.html' %} {% block content %}

<h1>Available Rooms</h1>

<div class="row">
  {% for room in rooms %}

  <div class="col-md-4 mb-4">
    <div class="card">
      {% if room.image %}

      <img src="{{ room.image.url }}" class="card-img-top" height="220" />

      {% endif %}

      <div class="card-body">
        <h4>{{ room.get_room_type_display }}</h4>

        <p>Room: {{ room.room_number }}</p>

        <p>Capacity: {{ room.capacity }} Guests</p>

        <p>Price: ₦{{ room.price_per_night }}</p>

        <a href="{% url 'room_detail' room.id %}" class="btn btn-primary">
          Details
        </a>
      </div>
    </div>
  </div>

  {% endfor %}
</div>

{% endblock %}
